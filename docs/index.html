<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Face Tracker</title>
    <meta
      name="description"
      content="Track face and body rigs in your browser"
    />
    <meta
      name="viewport"
      content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1"
    />
    <!--     Basic Three.js -->
         <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
<!-- then use window.Kalidokit -->
    <script src="https://unpkg.com/three@0.133.0/build/three.js"></script>
    <!--     GLTF Loader for Three.js -->
    <script src="https://unpkg.com/three@0.133.0/examples/js/loaders/GLTFLoader.js"></script>
    <!--     Orbit Controls for Three.js -->
    <script src="https://unpkg.com/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
    <!--     VRM Loader for Three.js -->
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>
    <!--     Mediapipe or Tensorflow.js -->
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js"
      crossorigin="anonymous"
    ></script>

    <!--     Mediapipe Drawing Tools -->
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <!--     Mediapipe Camera Tools -->
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="preview-container" class="preview-container">
      <video id="video-element" class="input_video" width="1280px" height="720px"></video>
      <canvas class="guides"></canvas>
    </div>
    
    <nav class="navbar">
      <button id="toggle-panel" class="btn btn-primary">⚙️ Settings</button>
      <label class="btn btn-primary" for="vrm-upload">📁 Load VRM</label>
      <input type="file" id="vrm-upload" accept=".vrm" style="display: none;" />
      <button id="export-settings" class="btn btn-success">💾 Export</button>
      <label class="btn btn-success" for="import-settings">📂 Import</label>
      <input type="file" id="import-settings" accept=".json" style="display: none;" />
    </nav>

    <div id="side-panel" class="side-panel">
      <div class="panel-header">
        <h2>Settings</h2>
        <button id="close-panel" class="close-btn">✕</button>
      </div>
      
      <div class="setting-group">
        <h3>General</h3>
        <label class="toggle-label">
          <input type="checkbox" id="freeze-model" />
          <span>Freeze 3D Model</span>
        </label>
      </div>

      <div class="setting-group">
        <h3>Visibility</h3>
        <label class="toggle-label">
          <input type="checkbox" id="show-video" checked />
          <span>Show Video</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="show-landmarks" checked />
          <span>Show Landmarks</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="show-ui" checked />
          <span>Show UI</span>
        </label>
      </div>

      <div class="setting-group">
        <h3>Face Cutouts</h3>
        <label class="toggle-label">
          <input type="checkbox" id="enable-cutout" />
          <span>Enable Overlays</span>
        </label>

        <h4>Positioning</h4>
        <div class="gizmo-controls">
          <button id="gizmo-zoom-out" class="btn btn-small">-</button>
          <button id="gizmo-zoom-in" class="btn btn-small">+</button>
        </div>
        <div class="gizmo-container">
          <canvas id="gizmo-canvas" width="260" height="200" style="background: #1a1a1a; border-radius: 8px; border: 1px solid #333;"></canvas>
          <p class="gizmo-legend">L = Left Eye &nbsp; R = Right Eye &nbsp; M = Mouth</p>
        </div>
        
        <div class="offset-controls">
          <div class="offset-item">
            <label>Left Eye Z-Offset:</label>
            <input type="number" id="z-offset-le" step="0.01" value="0.1" />
          </div>
          <div class="offset-item">
            <label>Right Eye Z-Offset:</label>
            <input type="number" id="z-offset-re" step="0.01" value="0.1" />
          </div>
          <div class="offset-item">
            <label>Mouth Z-Offset:</label>
            <input type="number" id="z-offset-m" step="0.01" value="0.1" />
          </div>
        </div>

        <label>Scale: <input type="number" id="cutout-scale" step="0.1" value="0.5" /></label>
      </div>

      <div class="setting-group">
        <h3>Background</h3>
        <label class="toggle-label">
          <input type="checkbox" id="bg-solid-enable" />
          <span>Solid Background Color</span>
        </label>
        <label>Color: <input type="color" id="bg-color-picker" value="#000000" /></label>
      </div>

      <div class="setting-group">
        <h3>Cutout Masks</h3>
        <label>Brush Size: <input type="range" id="brush-size" min="2" max="30" value="10" /></label>
        <label>Hardness: <input type="range" id="brush-hardness" min="0" max="100" value="80" step="1" /></label>
        
        <div class="preview-canvas-wrapper">
          <div class="canvas-toolbar">
            <button class="tool-btn active" data-tool="eraser" title="Eraser">⊘</button>
            <button class="tool-btn" data-tool="brush" title="Brush">🖌</button>
            <button class="reset-mask" title="Reset Mask">Reset</button>
          </div>
          <canvas id="eye-l-canvas" width="100" height="100"></canvas>
        </div>

        <div class="preview-canvas-wrapper">
          <div class="canvas-toolbar">
            <button class="tool-btn active" data-tool="eraser" title="Eraser">⊘</button>
            <button class="tool-btn" data-tool="brush" title="Brush">🖌</button>
            <button class="reset-mask" title="Reset Mask">Reset</button>
          </div>
          <canvas id="eye-r-canvas" width="100" height="100"></canvas>
        </div>

        <div class="preview-canvas-wrapper">
          <div class="canvas-toolbar">
            <button class="tool-btn active" data-tool="eraser" title="Eraser">⊘</button>
            <button class="tool-btn" data-tool="brush" title="Brush">🖌</button>
            <button class="reset-mask" title="Reset Mask">Reset</button>
          </div>
          <canvas id="mouth-canvas" width="150" height="100"></canvas>
        </div>
      </div>
    </div>
    <svg id="gizmo-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10;"></svg>
    <script src="./script.js" type="module" defer></script>
  </body>
</html>
